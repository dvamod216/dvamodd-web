<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVA Mod — Trang chính thức</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; max-width: 440px; width: 100%; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .badge { display: inline-block; background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.4); font-size: 12px; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    a.btn { display: block; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.2s; }
    .btn-primary { background: #238636; color: #ffffff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #30363d; }
    footer { margin-top: 20px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● Đang hoạt động</span>
    <h1>DVA Mod</h1>
    <p>Trang chia sẻ công cụ, dự án và cập nhật mới nhất tại dvamod.is-a.dev.</p>

    <div class="links">
      <a class="btn btn-primary" href="https://github.com/TEN_GITHUB_CUA_BAN" target="_blank">GitHub Cá Nhân</a>
      <a class="btn btn-secondary" href="#du-an">Danh sách công cụ / Mod</a>
      <a class="btn btn-secondary" href="#lien-he">Liên hệ hỗ trợ</a>
    </div>

    <footer>© 2026 dvamod.is-a.dev</footer>
  </div>
</body>
</html>
